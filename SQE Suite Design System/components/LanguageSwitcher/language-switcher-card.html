<!-- @dsCard group="Components" name="Language switcher" subtitle="segmented toggle · trigger + menu · disabled" viewport="1000x420" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SQE Suite — Language switcher</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
body{padding:48px;background:var(--hz-neutral-50);color:var(--hz-text-primary)}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.head a{font-size:12px;color:var(--hz-text-tertiary);text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hz-text-tertiary);font-weight:600}
.section{background:var(--hz-surface-card);border:1px solid var(--hz-border-subtle);border-radius:14px;padding:36px 40px}
.grid{display:grid;gap:32px;grid-template-columns:repeat(3,1fr)}
.cell{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.label{font-size:11px;color:var(--hz-text-tertiary);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
</style>
</head>
<body>
<div class="page">
<div class="head"><div><div class="eyebrow">Component</div><h1 class="hz-h3" style="margin:4px 0 0">Language switcher</h1></div><a href="../../ui-kit.html">← UI Kit</a></div>
<section class="section">
<div class="grid">
<div class="cell"><div class="label">Segmented — inline</div><div class="hz-lang-switch"><button class="hz-lang-switch__opt is-active">EN</button><button class="hz-lang-switch__opt">ID</button></div></div>
<div class="cell"><div class="label">Trigger + menu</div><button class="hz-lang-trigger"><i class="far fa-globe"></i>English<i class="far fa-chevron-down" style="font-size:11px"></i></button></div>
<div class="cell"><div class="label">Disabled</div><div class="hz-lang-switch hz-lang-switch--disabled"><button class="hz-lang-switch__opt is-active">EN</button><button class="hz-lang-switch__opt">ID</button></div></div>
</div>
</section>
</div>
</body></html>
