<!-- @dsCard group="Components" name="Product tour & Theme picker" subtitle="coachmark + tour card · appearance picker" viewport="1100x600" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SQE Suite — Product tour &amp; Theme picker</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
body{padding:48px;background:var(--hz-neutral-50);color:var(--hz-text-primary)}
.page{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.head a{font-size:12px;color:var(--hz-text-tertiary);text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hz-text-tertiary);font-weight:600}
.section{background:var(--hz-surface-card);border:1px solid var(--hz-border-subtle);border-radius:14px;padding:36px 40px}
.label{font-size:11px;color:var(--hz-text-tertiary);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:14px}
.divider{border-top:1px solid var(--hz-border-subtle);margin:24px 0}
.row{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
</style>
</head>
<body>
<div class="page">
<div class="head"><div><div class="eyebrow">Component</div><h1 class="hz-h3" style="margin:4px 0 0">Product tour &amp; Theme picker</h1></div><a href="../../ui-kit.html">← UI Kit</a></div>
<section class="section">
<div class="label">Coachmark + tour card</div>
<div class="row">
<button class="hz-coachmark hz-btn hz-btn--primary hz-btn--sm"><span class="hz-coachmark__pulse"></span><i class="far fa-plus"></i>New deal</button>
<div class="hz-tour-card">
<div class="hz-tour-card__step">Step 2 of 4</div>
<div class="hz-tour-card__title">Track every deal in one pipeline</div>
<div class="hz-tour-card__desc">Drag cards between stages, or let M&amp;A Brain suggest the next one.</div>
<div class="hz-tour-card__footer"><div class="hz-tour-card__dots"><span class="hz-tour-card__dot"></span><span class="hz-tour-card__dot is-active"></span><span class="hz-tour-card__dot"></span><span class="hz-tour-card__dot"></span></div><div style="display:flex;gap:8px"><button class="hz-btn hz-btn--text hz-btn--sm" style="color:#fff">Skip</button><button class="hz-btn hz-btn--sm" style="background:#fff;color:var(--hz-neutral-950)">Next</button></div></div>
</div>
</div>
<div class="divider"></div>
<div class="label">Appearance / theme picker</div>
<div class="hz-theme-picker">
<span class="hz-theme-swatch is-active" style="background:#006CEB"></span>
<span class="hz-theme-swatch" style="background:#159367"></span>
<span class="hz-theme-swatch" style="background:#7C48E4"></span>
<span class="hz-theme-swatch" style="background:#E45A18"></span>
<span class="hz-theme-swatch" style="background:#2CA7E4"></span>
<span class="hz-theme-swatch" style="background:#E437AE"></span>
</div>
<div class="row" style="margin-top:16px;gap:8px">
<button class="hz-lang-switch__opt is-active" style="background:var(--hz-surface-card);box-shadow:var(--hz-shadow-sm)">Light</button>
<button class="hz-lang-switch__opt">Dark</button>
<button class="hz-lang-switch__opt">System</button>
</div>
</section>
</div>
</body></html>
