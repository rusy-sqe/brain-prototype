<!-- @dsCard group="Components" name="Pagination" subtitle="page numbers · ellipsis · prev/next · disabled" viewport="1000x360" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SQE Suite — Pagination</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
body{padding:48px;background:var(--hz-neutral-50);color:var(--hz-text-primary)}
.page{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.head a{font-size:12px;color:var(--hz-text-tertiary);text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hz-text-tertiary);font-weight:600}
.section{background:var(--hz-surface-card);border:1px solid var(--hz-border-subtle);border-radius:14px;padding:36px 40px}
.stack{display:flex;flex-direction:column;gap:24px}
.label{font-size:11px;color:var(--hz-text-tertiary);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:10px}
</style>
</head>
<body>
<div class="page">
<div class="head"><div><div class="eyebrow">Component</div><h1 class="hz-h3" style="margin:4px 0 0">Pagination</h1></div><a href="../../ui-kit.html">← UI Kit</a></div>
<section class="section">
<div class="stack">
<div><div class="label">Default</div>
<nav class="hz-pagination">
<button class="hz-pagination__item hz-pagination__nav" aria-label="Previous"><i class="far fa-chevron-left" style="font-size:14px"></i></button>
<button class="hz-pagination__item is-active">1</button>
<button class="hz-pagination__item">2</button>
<button class="hz-pagination__item">3</button>
<span class="hz-pagination__ellipsis">…</span>
<button class="hz-pagination__item">12</button>
<button class="hz-pagination__item hz-pagination__nav" aria-label="Next"><i class="far fa-chevron-right" style="font-size:14px"></i></button>
</nav>
</div>
<div><div class="label">Disabled edges</div>
<nav class="hz-pagination">
<button class="hz-pagination__item hz-pagination__nav" disabled aria-label="Previous"><i class="far fa-chevron-left" style="font-size:14px"></i></button>
<button class="hz-pagination__item is-active">1</button>
<button class="hz-pagination__item">2</button>
<button class="hz-pagination__item">3</button>
<button class="hz-pagination__item hz-pagination__nav" aria-label="Next"><i class="far fa-chevron-right" style="font-size:14px"></i></button>
</nav>
</div>
</div>
</section>
</div>
</body></html>
