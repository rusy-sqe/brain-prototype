<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Settings" description="Tabbed settings page with sticky save bar, using Form Controls + Navigation" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="min-height:100vh;background:var(--hz-surface-page);font-family:var(--hz-font-sans);display:flex;flex-direction:column">
<div style="max-width:900px;margin:0 auto;width:100%;padding:40px 24px 120px;display:flex;flex-direction:column;gap:24px">
<div class="hz-page-header" style="padding-bottom:0"><div><div class="hz-page-header__title">Settings</div><div class="hz-page-header__desc">Manage your account, workspace and notification preferences.</div></div></div>
<nav class="hz-tabs">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<button class="{{ t.cls }}" onClick="{{ selectTab }}" data-tab="{{ t.label }}">{{ t.label }}</button>
</sc-for>
</nav>
<div style="background:var(--hz-surface-card);border:1px solid var(--hz-border-subtle);border-radius:var(--hz-radius-lg);padding:32px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;align-items:center;gap:16px">
<span class="hz-avatar hz-avatar--lg">AR</span>
<div><button class="hz-btn hz-btn--secondary hz-btn--sm">Change photo</button></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div class="hz-field hz-field--stacked"><label class="hz-field__label">Full name</label><div class="hz-field__control"><input class="hz-field__input" value="Andini Rahman"></div></div>
<div class="hz-field hz-field--stacked"><label class="hz-field__label">Email</label><div class="hz-field__control"><input class="hz-field__input" value="andini@sinarmas.co.id"></div></div>
</div>
<div class="hz-field hz-field--stacked"><label class="hz-field__label">Bio</label><div class="hz-field__control hz-field__control--textarea"><textarea class="hz-field__textarea" placeholder="Add a short bio…"></textarea></div></div>
<div style="border-top:1px solid var(--hz-border-subtle);padding-top:20px;display:flex;flex-direction:column;gap:14px">
<div class="hz-h6" style="margin:0">Notifications</div>
<label style="display:flex;align-items:center;gap:12px;justify-content:space-between"><span class="hz-body-r">Email me about deal updates</span><span class="hz-switch"><input type="checkbox" checked></input><span class="hz-switch__slider"></span></span></label>
<label style="display:flex;align-items:center;gap:12px;justify-content:space-between"><span class="hz-body-r">Weekly digest</span><span class="hz-switch"><input type="checkbox"></input><span class="hz-switch__slider"></span></span></label>
</div>
</div>
</div>
<div style="position:sticky;bottom:0;background:var(--hz-surface-card);border-top:1px solid var(--hz-border-subtle);padding:16px 24px;display:flex;justify-content:flex-end;gap:12px">
<button class="hz-btn hz-btn--secondary">Cancel</button>
<button class="hz-btn hz-btn--primary">Save changes</button>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { active: 'Profile' };
  renderVals() {
    return {
      tabs: ['Profile', 'Notifications', 'Workspace', 'Security'].map(label => ({ label, cls: 'hz-tab' + (label === this.state.active ? ' is-active' : '') })),
      selectTab: (e) => this.setState({ active: e.currentTarget.dataset.tab })
    };
  }
}
</script>
</body>
</html>
