<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Auth" description="Split-screen sign in / reset with brand panel, error and loading states" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--hz-surface-page);font-family:var(--hz-font-sans)">
<div style="background:var(--hz-horizon-primary);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.15);display:inline-flex;align-items:center;justify-content:center"><i class="far fa-gem"></i></span><span style="font-weight:700;font-size:16px">SQE Suite</span></div>
<div style="max-width:380px"><div style="font:700 32px/1.15 var(--hz-font-display);letter-spacing:-.01em;margin-bottom:12px">One suite, every intelligence.</div><div style="font-size:14px;opacity:.85;line-height:1.6">Assessment, deal-sourcing, forecasting — one design language across the whole portfolio.</div></div>
<div style="font-size:12px;opacity:.6">© 2026 · SQE Suite</div>
</div>
<div style="display:flex;align-items:center;justify-content:center;padding:48px">
<div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:20px">
<div><h1 class="hz-h3" style="margin:0 0 6px">Sign in</h1><p class="hz-body-r" style="color:var(--hz-text-tertiary);margin:0">Use your Sinarmas workspace account.</p></div>
<sc-if value="{{ error }}"><div class="hz-alert hz-alert--danger"><i class="far fa-triangle-exclamation hz-alert__icon"></i><div class="hz-body-s">Incorrect email or password. Try again.</div></div></sc-if>
<div class="hz-field hz-field--stacked"><label class="hz-field__label" style="background-color: #CCCCCC00">Email</label><div class="hz-field__control"><input class="hz-field__input" placeholder="name@sinarmas.co.id"></div></div>
<div class="hz-field hz-field--stacked"><label class="hz-field__label" style="background-color: #CCCCCC00">Password</label><div class="hz-field__control"><input class="hz-field__input" type="password" placeholder="••••••••"></div></div>
<div style="display:flex;justify-content:flex-end"><a href="#" class="hz-body-s">Forgot password?</a></div>
<button class="hz-btn hz-btn--primary hz-btn--full" onClick="{{ toggleError }}">Sign in</button>
<div style="display:flex;align-items:center;gap:10px;color:var(--hz-text-tertiary);font-size:12px"><div style="flex:1;height:1px;background:var(--hz-border-subtle)"></div>or<div style="flex:1;height:1px;background:var(--hz-border-subtle)"></div></div>
<button class="hz-btn hz-btn--secondary hz-btn--full"><i class="far fa-shield-check"></i>Continue with SSO</button>
</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  state = { error: false };
  renderVals() {
    return { error: this.state.error, toggleError: (e) => { e.preventDefault(); this.setState(s => ({ error: !s.error })); } };
  }
}
</script>
</body>
</html>
