<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="stylesheet" href="_ds/sqe-suite-design-system-2c1e794f-70f8-4aa1-bcdc-25d3a356aad5/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="_ds/sqe-suite-design-system-2c1e794f-70f8-4aa1-bcdc-25d3a356aad5/tokens.css">
<script src="_ds/sqe-suite-design-system-2c1e794f-70f8-4aa1-bcdc-25d3a356aad5/_ds_bundle.js"></script>
<style>html,body{height:100%;margin:0}</style>
</helmet>

<div style="min-height:100vh;background:var(--hz-surface-page);font-family:var(--hz-font-sans);display:flex;flex-direction:column;align-items:center;gap:32px;padding:40px">
  <div class="hz-h4" style="margin:0">Robot Head Avatar</div>

  <div style="display:flex;gap:28px;flex-wrap:wrap;justify-content:center;background:var(--hz-surface-card);border-radius:16px;padding:28px;box-shadow:var(--hz-shadow-md,0 4px 12px rgba(0,0,0,.08))">
    <sc-for list="{{ stateList }}" as="s" hint-placeholder-count="9">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:96px">
        <dc-import name="RoboAvatar" state="{{ s }}" color="{{ color }}" speed="{{ speed }}" size="{{ 84 }}" hint-size="84px,84px"></dc-import>
        <div class="hz-body-s" style="text-transform:capitalize;color:var(--hz-text-secondary)">{{ s }}</div>
      </div>
    </sc-for>
  </div>

  <div style="display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center">
    <dc-import name="RoboAvatar" state="{{ activeState }}" color="{{ color }}" speed="{{ speed }}" size="{{ 160 }}" hint-size="160px,160px"></dc-import>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:220px">
      <div>
        <div class="hz-body-s" style="font-weight:700;margin-bottom:6px">State</div>
        <select value="{{ activeState }}" onChange="{{ setActiveState }}" style="padding:8px 10px;border:1px solid var(--hz-border-default);border-radius:8px;font-family:inherit">
          <sc-for list="{{ stateList }}" as="s" hint-placeholder-count="9">
            <option value="{{ s }}">{{ s }}</option>
          </sc-for>
        </select>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="hz-body-s" style="font-weight:700">Preview at:</div>
        <dc-import name="RoboAvatar" state="{{ activeState }}" color="{{ color }}" speed="{{ speed }}" size="{{ 28 }}" hint-size="28px,28px"></dc-import>
        <dc-import name="RoboAvatar" state="{{ activeState }}" color="{{ color }}" speed="{{ speed }}" size="{{ 48 }}" hint-size="48px,48px"></dc-import>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:700}}">
class Component extends DCLogic {
  state = { color: '#3b82f6', speed: 'balanced', activeState: 'speaking' };
  renderVals() {
    return {
      stateList: ['idle','thinking','speaking','happy','working','attention','error','sleeping','exploring'],
      color: this.state.color,
      speed: this.state.speed,
      activeState: this.state.activeState,
      setActiveState: (e) => this.setState({ activeState: e.target.value })
    };
  }
}
</script>
</body>
</html>
